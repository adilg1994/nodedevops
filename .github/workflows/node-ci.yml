name: Node CI

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm ci

      - run: npm run lint

      - name: Push schema to test database
        run: npx drizzle-kit push --force

      - run: npm test

      - run: npm run build

      - name: Debug - print real OIDC token claims
        run: |
          node -e "
          const https = require('https');
          const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL + '&audience=sts.amazonaws.com');
          https.get(url, { headers: { Authorization: 'bearer ' + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN } }, res => {
            let data = '';
            res.on('data', c => data += c);
            res.on('end', () => {
              const token = JSON.parse(data).value;
              const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
              console.log(JSON.stringify(payload, null, 2));
            });
          });
          "

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::026056481305:role/github-actions-node-deploy
          aws-region: ap-south-1

      - name: Verify OIDC authentication
        run: aws sts get-caller-identity